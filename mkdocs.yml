site_name: Microsoft Fabric Essentials Workshop
site_description: Guided hands-on workshop for Microsoft Fabric foundations, engineering, AI, and delivery.
site_url: https://cloud2br-msftlearninghub.github.io/MS-Fabric-Essentials-Workshop/
repo_url: https://github.com/Cloud2BR-MSFTLearningHub/MS-Fabric-Essentials-Workshop
repo_name: Cloud2BR-MSFTLearningHub/MS-Fabric-Essentials-Workshop
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  logo: https://avatars.githubusercontent.com/u/195347873?v=4
  favicon: https://avatars.githubusercontent.com/u/195347873?v=4
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: blue
    accent: blue

nav:
  - Home: index.md
  - Fabric foundations: fabric-foundations.md
  - Provision the workshop: provision-the-workshop.md
  - Medallion architecture: medallion-architecture.md
  - AI and LLMs: ai-and-llms.md
  - AI skills: ai-skills.md
  - Delivery and operations: delivery-and-operations.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cloud2BR-MSFTLearningHub
      name: Cloud2BR OSS - Learning Hub

extra_css:
  - assets/css/custom.css
  - assets/css/fabric-palette-20260729.css

extra_javascript:
  - path: assets/js/logo-link.js
    type: module
  - path: assets/js/external-links.js
    type: module
  - path: assets/js/mermaid.js
    type: module

copyright: Copyright &copy; 2026 <a href="https://github.com/Cloud2BR-MSFTLearningHub" target="_blank" rel="noopener">Cloud2BR OSS - Learning Hub</a>